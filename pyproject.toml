[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "lex-earliest-seqs"
version = "0.1.0"
description = "Research tools for stateful lexicographically earliest sequences and incidence chronology tables"
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
authors = [
  { name = "Nathan Nichols", email = "communications@resultsmotivated.com" },
]
dependencies = []

[project.scripts]
lex-earliest-seqs = "lex_earliest_seqs.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "black>=24.4.2,<25",
  "basedpyright>=1.31.5,<2",
  "ruff>=0.13.2,<0.14",
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.pyright]
typeCheckingMode = "off"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"

[tool.ruff]
lint.select = ["F401"]
fix = true
src = ["src", "tests"]
