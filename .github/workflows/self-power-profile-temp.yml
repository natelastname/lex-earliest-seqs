name: Temporary self-power profile

on:
  push:
    branches:
      - perf/self-power-prime-coordinate-20260903
  workflow_dispatch:

concurrency:
  group: self-power-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked
      - name: Scale portable X000014 with cached coordinates
        env:
          LEX_EARLIEST_SEQS_DISABLE_PRIMECOUNT: '1'
          LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE: '1'
        run: |
          /usr/bin/time -f 'X000014 elapsed=%e maxrss_kb=%M' timeout 5m \
            uv run python - <<'PY'
          from time import perf_counter
          from lex_earliest_seqs import registry

          generator = registry.resolve('X000014').generator_factory()
          for count in (100, 1_000, 10_000):
              start = perf_counter()
              generator.extend_to(count)
              print(
                  f'X000014 count={count} delta={perf_counter()-start:.6f} '
                  f'primes={len(generator.retained_primes)} '
                  f'multipliers={len(generator.multiplier_values)} '
                  f'max_term={max(generator.terms)}',
                  flush=True,
              )
          PY
      - name: Check formatting and imports
        run: |
          uv run black --check src tests
          uv run ruff check src tests
      - name: Run full test suite with durations
        run: uv run pytest -q --durations=30
