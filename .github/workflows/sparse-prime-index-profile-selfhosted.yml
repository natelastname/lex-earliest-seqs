name: Sparse prime-index generator profile self-hosted

on:
  push:
    branches:
      - feature/sparse-prime-coordinate-ew-20260903
    paths:
      - '.github/workflows/sparse-prime-index-profile-selfhosted.yml'
      - 'src/lex_earliest_seqs/zoo/sparse_prime_index_only_enots_wolley.py'
      - 'src/lex_earliest_seqs/zoo/sparse_prime_index_candidate_optimized.py'
      - 'src/lex_earliest_seqs/zoo/scalable_prime_lookup.py'
      - 'src/lex_earliest_seqs/zoo/every_kth_prime_enots_wolley.py'
      - 'src/lex_earliest_seqs/zoo/__init__.py'
      - 'tests/test_sparse_prime_index_only_enots_wolley.py'
      - 'tests/test_scalable_prime_lookup.py'
  workflow_dispatch:

concurrency:
  group: sparse-prime-index-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked
      - name: Compare generic and family-specialized candidate engines
        env:
          LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE: '1'
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import cProfile
          import io
          import pstats
          import time

          from lex_earliest_seqs.zoo.sparse_prime_index_only_enots_wolley import (
              SparsePrimeIndexOnlyEnotsWolleyGenerator,
          )
          from lex_earliest_seqs.zoo.sparse_prime_index_candidate_optimized import (
              PowerOfTwoIndexPrimeOnlyEnotsWolleyGenerator,
              SelfPowerIndexPrimeOnlyEnotsWolleyGenerator,
              SquareIndexPrimeOnlyEnotsWolleyGenerator,
          )

          cases = (
              ('square', 10_000, SquareIndexPrimeOnlyEnotsWolleyGenerator),
              ('power_of_two', 10_000, PowerOfTwoIndexPrimeOnlyEnotsWolleyGenerator),
              ('self_power', 24, SelfPowerIndexPrimeOnlyEnotsWolleyGenerator),
          )

          for family, count, optimized_type in cases:
              timings = {}
              for label, factory in (
                  ('generic', lambda family=family: SparsePrimeIndexOnlyEnotsWolleyGenerator(family=family)),
                  ('optimized', optimized_type),
              ):
                  generator = factory()
                  profiler = cProfile.Profile()
                  start = time.perf_counter()
                  profiler.enable()
                  generator.extend_to(count)
                  profiler.disable()
                  elapsed = time.perf_counter() - start
                  timings[label] = elapsed
                  print(
                      f'PROFILE family={family} engine={label} count={count} '
                      f'seconds={elapsed:.6f} multipliers={len(generator.multiplier_values)} '
                      f'opened_primes={generator.next_allowed_position} '
                      f'known_primes={len(generator.retained_primes)} '
                      f'max_term_bits={max(generator.terms).bit_length()} '
                      f'pair_streams={len(getattr(generator, "pair_multiplier_successors", {}))}',
                      flush=True,
                  )
                  if label == 'optimized':
                      stream = io.StringIO()
                      pstats.Stats(profiler, stream=stream).strip_dirs().sort_stats('cumulative').print_stats(20)
                      print(stream.getvalue(), flush=True)
              print(
                  f'SPEEDUP family={family} generic_over_optimized='
                  f'{timings["generic"] / timings["optimized"]:.3f}',
                  flush=True,
              )
          PY
      - name: Profile self-power with optional C++ nth-prime backend
        continue-on-error: true
        run: |
          set -euo pipefail
          time timeout 10m uv run --with 'primesieve>=2.3.4,<3' python - <<'PY'
          import cProfile
          import io
          import pstats
          import time

          from lex_earliest_seqs.zoo.sparse_prime_index_candidate_optimized import (
              SelfPowerIndexPrimeOnlyEnotsWolleyGenerator,
          )

          generator = SelfPowerIndexPrimeOnlyEnotsWolleyGenerator()
          profiler = cProfile.Profile()
          start = time.perf_counter()
          profiler.enable()
          generator.extend_to(30)
          profiler.disable()
          elapsed = time.perf_counter() - start
          print(
              f'PRIMESIEVE family=self_power count=30 seconds={elapsed:.6f} '
              f'multipliers={len(generator.multiplier_values)} '
              f'opened_primes={generator.next_allowed_position} '
              f'known_primes={len(generator.retained_primes)} '
              f'max_term_bits={max(generator.terms).bit_length()}',
              flush=True,
          )
          stream = io.StringIO()
          pstats.Stats(profiler, stream=stream).strip_dirs().sort_stats('cumulative').print_stats(20)
          print(stream.getvalue(), flush=True)
          PY
      - name: Benchmark high index prime lookup
        continue-on-error: true
        run: |
          set -euxo pipefail
          time timeout 10m uv run --with 'primesieve>=2.3.4,<3' python - <<'PY'
          import time
          import primesieve

          for n in (823_543, 16_777_216, 387_420_489):
              start = time.perf_counter()
              value = primesieve.nth_prime(n)
              print(f'n={n} p_n={value} seconds={time.perf_counter() - start:.6f}', flush=True)
          PY
