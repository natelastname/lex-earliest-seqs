name: PrimeSieve nth-prime benchmark

on:
  push:
    branches:
      - feature/sparse-prime-coordinate-ew-20260903
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install primesieve
        run: uv pip install --system 'primesieve>=2.3.4,<3'
      - name: Benchmark sparse-family indices
        run: |
          python - <<'PY'
          import time
          import primesieve

          for n in (823543, 16777216, 387420489):
              start = time.perf_counter()
              value = primesieve.nth_prime(n)
              elapsed = time.perf_counter() - start
              print(f"n={n} p_n={value} seconds={elapsed:.3f}", flush=True)
          PY
