name: Validate term exports

on:
  push:
    branches:
      - feature/terms-export-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Refresh lockfile
        run: uv lock

      - name: Install
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run pytest

      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run black --check src tests
          uv run basedpyright

      - name: Smoke term exports
        run: |
          uv run lex-earliest-seqs terms ew 10 --no-cache --no-progress -o /tmp/ew.parquet --format parquet
          uv run lex-earliest-seqs terms ew 10 --no-cache --no-progress -o /tmp/ew.csv --format csv
          uv run python - <<'PY'
          import pyarrow.parquet as pq
          table = pq.read_table('/tmp/ew.parquet')
          assert table.column_names == ['subscript', 'value']
          assert table.num_rows == 10
          assert table['subscript'].to_pylist()[:3] == [1, 2, 3]
          assert table['value'].to_pylist()[:3] == [1, 2, 6]
          PY
          head -n 3 /tmp/ew.csv

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh lockfile for PyArrow export support [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
