name: Temporary primecountpy refactor validation

on:
  push:
    branches:
      - perf/self-power-prime-coordinate-20260903
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Reject optional nth-prime backend remnants
        run: |
          if grep -R -n -E \
            'LEX_EARLIEST_SEQS_DISABLE_PRIMECOUNT|LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE|_load_primecount_executable|_load_primesieve|_segmented_nth_prime|remember_nth_prime' \
            src tests; then
            echo 'optional/checkpoint nth-prime backend remnants remain' >&2
            exit 1
          fi
      - name: Check changed files and imports
        run: |
          uv run ruff check --no-fix \
            src/lex_earliest_seqs/zoo/__init__.py \
            src/lex_earliest_seqs/zoo/every_kth_prime_enots_wolley.py \
            src/lex_earliest_seqs/zoo/scalable_prime_lookup.py \
            src/lex_earliest_seqs/zoo/sparse_prime_index_only_enots_wolley.py \
            tests/test_scalable_prime_lookup.py \
            tests/test_prime_coordinate_multiplier_optimization.py
          uv run python -m compileall -q src tests
      - name: Direct primecountpy nth-prime probes
        run: |
          uv run python - <<'PY'
          from time import perf_counter
          from lex_earliest_seqs.zoo.scalable_prime_lookup import scalable_nth_prime

          expected = {
              823_543: 12_579_617,
              16_777_216: 310_248_241,
              387_420_489: 8_448_283_757,
              10_000_000_000: 252_097_800_623,
          }
          for index, wanted in expected.items():
              start = perf_counter()
              value = scalable_nth_prime(index)
              assert value == wanted
              print(f'p_{index}={value} elapsed={perf_counter()-start:.6f}', flush=True)
          PY
      - name: Bound 128-bit prime counting experiment
        continue-on-error: true
        run: |
          timeout 20s uv run python - <<'PY'
          from time import perf_counter
          from primecountpy.primecount import prime_pi_128

          value = 18_971_766_861_780_490_000
          start = perf_counter()
          count = prime_pi_128(value)
          print(
              f'pi({value})={count} target_delta={count - 15**15} '
              f'elapsed={perf_counter()-start:.6f}',
              flush=True,
          )
          PY
      - name: Scale X000014 within direct nth-prime range
        run: |
          /usr/bin/time -f 'X000014 elapsed=%e maxrss_kb=%M' timeout 2m \
            uv run python - <<'PY'
          from time import perf_counter
          from lex_earliest_seqs import registry

          generator = registry.resolve('X000014').generator_factory()
          for count in (100, 1_000):
              start = perf_counter()
              generator.extend_to(count)
              max_index = max(
                  generator._allowed_prime_index(i)
                  for i in range(len(generator.retained_primes))
              )
              print(
                  f'count={count} delta={perf_counter()-start:.6f} '
                  f'primes={len(generator.retained_primes)} '
                  f'max_prime_index={max_index} '
                  f'multipliers={len(generator.multiplier_values)} '
                  f'max_term={max(generator.terms)}',
                  flush=True,
              )
          PY
      - name: Full test suite
        run: uv run pytest -q --durations=30
