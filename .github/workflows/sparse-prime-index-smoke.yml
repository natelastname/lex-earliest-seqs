name: Sparse prime-index EW smoke

on:
  push:
    branches:
      - feature/sparse-prime-coordinate-ew-20260903
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked
      - name: Run sparse-family tests
        run: uv run pytest tests/test_sparse_prime_index_only_enots_wolley.py
      - name: Compute 1000 terms of each sequence
        run: |
          set -euxo pipefail
          for seq in X000012 X000013 X000014; do
            echo "=== $seq first 20 ==="
            uv run lex-earliest-seqs terms "$seq" 20 --no-cache --no-progress
            echo "=== $seq compute 1000 ==="
            time uv run lex-earliest-seqs compute "$seq" 1000 --no-cache --no-progress
          done
