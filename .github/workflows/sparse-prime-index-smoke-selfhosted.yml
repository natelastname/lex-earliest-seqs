name: Sparse prime-index EW smoke self-hosted

on:
  push:
    branches:
      - feature/sparse-prime-coordinate-ew-20260903
  workflow_dispatch:

concurrency:
  group: sparse-prime-index-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked
      - name: Run full test suite
        run: uv run pytest
      - name: Compute finite prefixes with portable backend
        env:
          LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE: '1'
        run: |
          set -euxo pipefail

          for seq in X000012 X000013; do
            echo "=== $seq first 20 ==="
            uv run lex-earliest-seqs terms "$seq" 20 --no-cache --no-progress
            echo "=== $seq compute 1000 ==="
            time uv run lex-earliest-seqs compute "$seq" 1000 --no-cache --no-progress
          done

          # The retained indices 1^1,2^2,3^3,... grow too fast for term count
          # to be a meaningful asymptotic benchmark. This smoke test verifies a
          # nontrivial exact prefix without asking for astronomical p_{i^i}.
          echo '=== X000014 compute 30 ==='
          time timeout 10m uv run lex-earliest-seqs compute X000014 30 \
            --no-cache --no-progress
