name: Sparse prime-index EW smoke self-hosted

on:
  push:
    branches:
      - feature/sparse-prime-coordinate-ew-20260903
  workflow_dispatch:

concurrency:
  group: sparse-prime-index-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked
      - name: Run full test suite
        run: uv run pytest
      - name: Compare specialized engines with generic sparse engine
        env:
          LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE: '1'
        run: |
          set -euxo pipefail
          uv run python - <<'PY'
          from lex_earliest_seqs.zoo.sparse_prime_index_only_enots_wolley import (
              SparsePrimeIndexOnlyEnotsWolleyGenerator,
          )
          from lex_earliest_seqs.zoo.sparse_prime_index_candidate_optimized import (
              PowerOfTwoIndexPrimeOnlyEnotsWolleyGenerator,
              SelfPowerIndexPrimeOnlyEnotsWolleyGenerator,
              SquareIndexPrimeOnlyEnotsWolleyGenerator,
          )

          cases = (
              ('square', 5_000, SquareIndexPrimeOnlyEnotsWolleyGenerator),
              ('power_of_two', 5_000, PowerOfTwoIndexPrimeOnlyEnotsWolleyGenerator),
              ('self_power', 20, SelfPowerIndexPrimeOnlyEnotsWolleyGenerator),
          )
          for family, count, optimized_type in cases:
              generic = SparsePrimeIndexOnlyEnotsWolleyGenerator(family=family)
              optimized = optimized_type()
              generic.extend_to(count)
              optimized.extend_to(count)
              assert optimized.terms == generic.terms
              assert optimized.term_support_masks == generic.term_support_masks
              print(f'equivalent family={family} count={count}')
          PY
      - name: Compute finite prefixes with portable backend
        env:
          LEX_EARLIEST_SEQS_DISABLE_PRIMESIEVE: '1'
        run: |
          set -euxo pipefail

          for seq in X000012 X000013; do
            echo "=== $seq first 20 ==="
            uv run lex-earliest-seqs terms "$seq" 20 --no-cache --no-progress
            echo "=== $seq compute 5000 ==="
            time uv run lex-earliest-seqs compute "$seq" 5000 --no-cache --no-progress
          done

          echo '=== X000014 compute 24 ==='
          time timeout 10m uv run lex-earliest-seqs compute X000014 24 \
            --no-cache --no-progress
